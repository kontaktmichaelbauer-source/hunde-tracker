; Zwei Geraete, ein Projekt:
;   pio run -e halsband -t upload     (Halsband flashen)
;   pio run -e station  -t upload     (Station flashen)
[platformio]
default_envs = halsband, station

[env]
platform = espressif32@6.9.0
; gleicher Chip (ESP32-S3, 8 MB) wie der Wireless Tracker – Pins setzen wir selbst
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  jgromes/RadioLib@^7.1.0

[env:halsband]
build_src_filter = +<halsband/>
lib_deps =
  ${env.lib_deps}
  mikalhart/TinyGPSPlus@^1.1.0

[env:station]
build_src_filter = +<station/>
board_build.embed_txtfiles =
  web/index.html
  web/manifest.json
board_build.embed_files =
  web/icon-192.png
  web/icon-512.png
  web/apple-touch-icon.png
lib_deps =
  ${env.lib_deps}
  bblanchon/ArduinoJson@^7.2.0
  knolleary/PubSubClient@^2.8
